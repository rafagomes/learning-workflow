name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo checks
        run: bash tests/run.sh
      - name: Shellcheck
        run: shellcheck skills/init/templates/tools/guard.sh skills/init/templates/tools/hooks/pre-commit tests/*.sh
