<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="t d"><title id="t">Topic and concept statuses</title><desc id="d">Main path todo, learning, practised, ready, built, reflected. Self-assessed claimed goes to ready on a passed quiz or back to todo on a failed one. A missed check sends practised or ready back to learning. In build mode a right done-check moves todo, learning or practised straight to built.</desc><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656c76"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ab7df8"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker></defs><rect x="20" y="150" width="110" height="40" rx="20" fill="#151b23"/><rect x="20" y="150" width="110" height="40" rx="20" fill="#151b23" stroke="#656c76" stroke-width="1.5"/><text x="75.0" y="175" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle" xml:space="preserve">todo</text><rect x="165" y="150" width="110" height="40" rx="20" fill="#151b23"/><rect x="165" y="150" width="110" height="40" rx="20" fill="#3fb9501f" stroke="#3fb950" stroke-width="1.5"/><text x="220.0" y="175" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle" xml:space="preserve">learning</text><rect x="310" y="150" width="110" height="40" rx="20" fill="#151b23"/><rect x="310" y="150" width="110" height="40" rx="20" fill="#3fb9501f" stroke="#3fb950" stroke-width="1.5"/><text x="365.0" y="175" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle" xml:space="preserve">practised</text><rect x="455" y="150" width="110" height="40" rx="20" fill="#151b23"/><rect x="455" y="150" width="110" height="40" rx="20" fill="#4493f81f" stroke="#4493f8" stroke-width="1.5"/><text x="510.0" y="175" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle" xml:space="preserve">ready</text><rect x="600" y="150" width="110" height="40" rx="20" fill="#151b23"/><rect x="600" y="150" width="110" height="40" rx="20" fill="#ab7df81f" stroke="#ab7df8" stroke-width="1.5"/><text x="655.0" y="175" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle" xml:space="preserve">built</text><rect x="745" y="150" width="110" height="40" rx="20" fill="#151b23"/><rect x="745" y="150" width="110" height="40" rx="20" fill="#ab7df81f" stroke="#ab7df8" stroke-width="1.5"/><text x="800.0" y="175" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle" xml:space="preserve">reflected</text><rect x="20" y="40" width="110" height="40" rx="20" fill="#151b23"/><rect x="20" y="40" width="110" height="40" rx="20" fill="#f0883e1f" stroke="#f0883e" stroke-width="1.5"/><text x="75.0" y="65" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle" xml:space="preserve">claimed</text><path d="M130,170 L161,170" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><text x="147.5" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9198a1" text-anchor="middle" xml:space="preserve">teach</text><path d="M275,170 L306,170" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><text x="292.5" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9198a1" text-anchor="middle" xml:space="preserve">practice</text><path d="M420,170 L451,170" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><text x="437.5" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9198a1" text-anchor="middle" xml:space="preserve">quiz</text><path d="M565,170 L596,170" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><text x="582.5" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9198a1" text-anchor="middle" xml:space="preserve">ship</text><path d="M710,170 L741,170" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><text x="727.5" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9198a1" text-anchor="middle" xml:space="preserve">reflect</text><path d="M75,80 L75,146" fill="none" stroke="#f0883e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-orange)"/><text x="83" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9198a1" text-anchor="start" xml:space="preserve">quiz failed</text><path d="M130,60 L510,60 L510,146" fill="none" stroke="#f0883e" stroke-width="1.6" marker-end="url(#m-orange)"/><text x="320" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9198a1" text-anchor="middle" xml:space="preserve">quiz passed</text><path d="M475,146 C440,96 270,96 235,146" fill="none" stroke="#f0883e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-orange)"/><path d="M330,146 C315,124 270,124 255,146" fill="none" stroke="#f0883e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-orange)"/><text x="355" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9198a1" text-anchor="middle" xml:space="preserve">missed check</text><path d="M60,190 L60,250" fill="none" stroke="#4493f8" stroke-width="1.6"/><path d="M205,190 L205,250" fill="none" stroke="#4493f8" stroke-width="1.6"/><path d="M350,190 L350,250" fill="none" stroke="#4493f8" stroke-width="1.6"/><path d="M60,250 L655,250 L655,194" fill="none" stroke="#4493f8" stroke-width="1.6" marker-end="url(#m-blue)"/><text x="360" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#4493f8" text-anchor="middle" xml:space="preserve">build mode: done-check right → built</text><text x="20" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">Statuses move back only on evidence. Build mode can also take claimed → built (check right) or claimed → learning (missed);</text><text x="20" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">a failed first quiz changes nothing, and built or reflected keep their status.</text></svg>
