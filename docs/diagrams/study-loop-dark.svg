<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d"><title id="t">The study loop</title><desc id="d">A curriculum, or a learning plan studied in order, then teach and practice lead to a quiz gate; failing sends you back to the gap, passing a whole phase means you build it in your project, then reflect; misses and reflections feed a spaced-repetition flashcard deck.</desc><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656c76"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ab7df8"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker></defs><rect x="20" y="60" width="180" height="80" rx="12" fill="#151b23"/><rect x="20" y="60" width="180" height="80" rx="12" fill="#3fb9501f" stroke="#3fb950" stroke-width="1.5"/><text x="36" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">/learn:curriculum</text><text x="36" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">or a plan, in order</text><rect x="230" y="60" width="180" height="80" rx="12" fill="#151b23"/><rect x="230" y="60" width="180" height="80" rx="12" fill="#3fb9501f" stroke="#3fb950" stroke-width="1.5"/><text x="246" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">/learn:teach</text><text x="246" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">one concept at a time</text><rect x="440" y="60" width="180" height="80" rx="12" fill="#151b23"/><rect x="440" y="60" width="180" height="80" rx="12" fill="#3fb9501f" stroke="#3fb950" stroke-width="1.5"/><text x="456" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">/learn:practice</text><text x="456" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">make failing tests pass</text><path d="M200,100 L226,100" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><path d="M410,100 L436,100" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><rect x="650" y="60" width="210" height="80" rx="12" fill="#151b23"/><rect x="650" y="60" width="210" height="80" rx="12" fill="#f0883e1f" stroke="#f0883e" stroke-width="1.5"/><text x="666" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">/learn:quiz</text><text x="666" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">≥ 80% and every critical right</text><path d="M620,100 L646,100" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><path d="M710,60 C690,6 330,6 320,56" fill="none" stroke="#f0883e" stroke-width="1.6" marker-end="url(#m-orange)"/><text x="515" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#9198a1" text-anchor="middle" xml:space="preserve">not yet: revisit the gap</text><rect x="650" y="200" width="210" height="80" rx="12" fill="#151b23"/><rect x="650" y="200" width="210" height="80" rx="12" fill="#f0883e1f" stroke="#f0883e" stroke-width="1.5"/><text x="666" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">Build it</text><text x="666" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#f0883e" text-anchor="start" xml:space="preserve">in your project</text><text x="666" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">its own workflow, untouched</text><path d="M755,140 L755,196" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><text x="745" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#9198a1" text-anchor="end" xml:space="preserve">ready, whole phase</text><rect x="330" y="200" width="250" height="80" rx="12" fill="#151b23"/><rect x="330" y="200" width="250" height="80" rx="12" fill="#3fb9501f" stroke="#3fb950" stroke-width="1.5"/><text x="346" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">/learn:reflect</text><text x="346" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">prediction vs result · new gaps</text><path d="M650,240 L584,240" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><path d="M330,240 L110,240 L110,144" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><text x="220" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#9198a1" text-anchor="middle" xml:space="preserve">gaps become topics</text><rect x="240" y="318" width="400" height="64" rx="12" fill="#151b23"/><rect x="240" y="318" width="400" height="64" rx="12" fill="#ab7df81f" stroke="#ab7df8" stroke-width="1.5"/><text x="256" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">Flashcards</text><text x="256" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">Leitner boxes · reviewed after 1 · 2 · 4 · 8 · 16 days</text><path d="M860,112 L872,112 L872,350 L644,350" fill="none" stroke="#ab7df8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-purple)"/><path d="M455,280 L455,314" fill="none" stroke="#ab7df8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-purple)"/><text x="463" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#9198a1" text-anchor="start" xml:space="preserve">lessons learned</text><text x="864" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#9198a1" text-anchor="end" xml:space="preserve">quiz misses</text></svg>
