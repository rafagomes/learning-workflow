<svg xmlns="http://www.w3.org/2000/svg" width="880" height="405" viewBox="0 0 880 405" role="img" aria-labelledby="t d"><title id="t">Build mode</title><desc id="d">A dev plan becomes a learning plan; /learn:build turns learn mode on for a step; every prompt codes at your level with concept notes, predictions and deep dives; when the step is done a done-check and wrap-up run and learn mode turns off.</desc><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656c76"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ab7df8"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker></defs><rect x="20" y="30" width="190" height="96" rx="12" fill="#151b23"/><rect x="20" y="30" width="190" height="96" rx="12" fill="#f0883e1f" stroke="#f0883e" stroke-width="1.5"/><text x="36" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">Dev plan</text><text x="36" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#f0883e" text-anchor="start" xml:space="preserve">in your project</text><text x="36" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">spec · roadmap · issue · goal</text><rect x="250" y="30" width="190" height="96" rx="12" fill="#151b23"/><rect x="250" y="30" width="190" height="96" rx="12" fill="#4493f81f" stroke="#4493f8" stroke-width="1.5"/><text x="266" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">/learn:plan</text><text x="266" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4493f8" text-anchor="start" xml:space="preserve">learning plan, by step</text><text x="266" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">concepts known / new</text><text x="266" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">level · done-check</text><rect x="480" y="30" width="190" height="96" rx="12" fill="#151b23"/><rect x="480" y="30" width="190" height="96" rx="12" fill="#4493f81f" stroke="#4493f8" stroke-width="1.5"/><text x="496" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">/learn:build S1</text><text x="496" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4493f8" text-anchor="start" xml:space="preserve">learn mode on</text><text x="496" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">due flashcards first</text><path d="M210,78 L246,78" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><path d="M440,78 L476,78" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><rect x="300" y="168" width="560" height="170" rx="16" fill="#151b23"/><rect x="300" y="168" width="560" height="170" rx="16" fill="#4493f81f" stroke="#4493f8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="318" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">Every prompt, until the step is done</text><rect x="318" y="214" width="254" height="46" rx="10" fill="#151b23"/><rect x="318" y="214" width="254" height="46" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="332" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">Code at your level</text><text x="332" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">claude · adaptive · you</text><rect x="590" y="214" width="254" height="46" rx="10" fill="#151b23"/><rect x="590" y="214" width="254" height="46" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="604" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">▸ Concept note</text><text x="604" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">only when a decision needs it</text><rect x="318" y="270" width="254" height="46" rx="10" fill="#151b23"/><rect x="318" y="270" width="254" height="46" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="332" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">Predict, then run</text><text x="332" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">before tests and evals</text><rect x="590" y="270" width="254" height="46" rx="10" fill="#151b23"/><rect x="590" y="270" width="254" height="46" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="604" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">Deep dive</text><text x="604" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">while background tasks run</text><rect x="652.6" y="154" width="158.8" height="28" rx="14" fill="#151b23"/><rect x="652.6" y="154" width="158.8" height="28" rx="14" fill="#ab7df81f" stroke="#ab7df8" stroke-width="1.2"/><text x="732" y="172.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#ab7df8" text-anchor="middle" xml:space="preserve">hook re-injects state</text><path d="M575,126 L575,164" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><rect x="20" y="168" width="240" height="80" rx="12" fill="#151b23"/><rect x="20" y="168" width="240" height="80" rx="12" fill="#3fb9501f" stroke="#3fb950" stroke-width="1.5"/><text x="36" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">Step done</text><text x="36" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3fb950" text-anchor="start" xml:space="preserve">you say so, or the PR opens</text><path d="M300,208 L264,208" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><rect x="20" y="270" width="240" height="120" rx="12" fill="#151b23"/><rect x="20" y="270" width="240" height="120" rx="12" fill="#3fb9501f" stroke="#3fb950" stroke-width="1.5"/><text x="36" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" xml:space="preserve">Done-check → wrap-up</text><text x="36" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3fb950" text-anchor="start" xml:space="preserve">3–5 questions on your code</text><text x="36" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">build log · flashcards · PROGRESS</text><text x="36" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">learn mode off</text><text x="36" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" xml:space="preserve">then /learn:build &lt;next step&gt;</text><path d="M140,248 L140,266" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#m-line)"/><text x="860" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end" xml:space="preserve">Deep concepts are noted for /learn:teach later.</text><text x="860" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end" xml:space="preserve">/learn:off pauses early and saves what you covered.</text></svg>
